{% extends 'cars/base.html' %}
{% block main_content %}

<div style="max-width: 500px; margin: 50px auto; padding: 20px; background-color: #0b111e; border-radius: 8px; color: #ffffff;">
    
    <h1 style="font-size: 28px; margin-bottom: 20px;">
        {% if form.instance.pk %}Edit Brand{% else %}New Brand{% endif %}
    </h1>
    <hr style="border-color: #2d3748; margin-bottom: 25px;">
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="mb-4" style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Brand Name:</label>
            {{ form.name }}
        </div>

        <div class="mb-4" style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Brand Logo (Photo):</label>
            {{ form.logo }}
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary" style="background-color: #1e3a8a; border: none; padding: 10px 24px; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; margin-right: 12px;">Save</button>
            <a href="{% url 'brand_list' %}" class="btn btn-secondary" style="background-color: #4b5563; padding: 10px 24px; border-radius: 6px; color: white; text-decoration: none; font-weight: bold; display: inline-block;">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
