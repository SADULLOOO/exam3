<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} бренд</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <h1>{% if form.instance.pk %}Редактирование бренда{% else %}Новый бренд{% endif %}</h1>
    <hr>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.name.label_tag }}
            {{ form.name }}
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'brand_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</body>
</html>
