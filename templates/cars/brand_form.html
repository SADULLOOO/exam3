{% extends 'cars/base.html' %}
{% block main_content %}

<div class="car-form-wrapper">

  <h1>{% if form.instance.pk %}Edit Brand{% else %}New Brand{% endif %}</h1>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div style="margin-bottom: 18px;">
      <label style="
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: #7a93b8;
        margin-bottom: 7px;
      ">Brand Name</label>
      {{ form.name }}
    </div>

    <div style="margin-bottom: 24px;">
      <label style="
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: #7a93b8;
        margin-bottom: 7px;
      ">Brand Logo</label>

      <label style="
        display: flex;
        align-items: center;
        gap: 12px;
        background: #0d1728;
        border: 1px dashed #1e3050;
        border-radius: 10px;
        padding: 16px 18px;
        cursor: pointer;
        transition: border-color 0.22s;
      " onmouseover="this.style.borderColor='#e85d04'"
         onmouseout="this.style.borderColor='#1e3050'">
        <span style="font-size: 22px;">📁</span>
        <div>
          <div style="font-size: 14px; font-weight: 600; color: #f0f4ff;">
            Choose file
          </div>
          <div style="font-size: 12px; color: #3d5478; margin-top: 2px;">
            PNG, JPG, SVG
          </div>
        </div>
        <div style="margin-left: auto;">
          {{ form.logo }}
        </div>
      </label>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 8px;">
      <button type="submit" style="
        flex: 1;
        background: linear-gradient(135deg, #e85d04, #ff7a2a);
        color: #fff;
        border: none;
        padding: 13px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        font-family: 'DM Sans', sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(232,93,4,0.3);
        transition: all 0.22s;
      ">Save</button>

      <a href="{% url 'brand_list' %}" style="
        flex: 1;
        background: #131f35;
        color: #7a93b8;
        border: 1px solid #1e3050;
        padding: 13px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        font-family: 'DM Sans', sans-serif;
        text-decoration: none;
        text-align: center;
        transition: all 0.22s;
        display: inline-block;
      ">Cancel</a>
    </div>

  </form>
</div>

<style>
  /* Fix Django form.name input */
  .car-form-wrapper form input[type="text"],
  .car-form-wrapper form input[name="name"] {
    width: 100% !important;
    background: #0d1728 !important;
    border: 1px solid #1e3050 !important;
    color: #f0f4ff !important;
    padding: 11px 14px !important;
    border-radius: 10px !important;
    font-size: 14px !important;
    font-family: 'DM Sans', sans-serif !important;
    outline: none !important;
    box-sizing: border-box !important;
  }
  .car-form-wrapper form input[type="text"]:focus {
    border-color: #e85d04 !important;
    box-shadow: 0 0 0 3px rgba(232,93,4,0.12) !important;
  }
  /* Hide default file input */
  .car-form-wrapper form input[type="file"] {
    opacity: 0 !important;
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
  }
</style>

{% endblock %}
