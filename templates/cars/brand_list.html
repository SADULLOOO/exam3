{% extends "cars/base.html" %}
{% block main_content %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список брендов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Все бренды</h1>
        <a href="{% url 'brand_create' %}" class="btn btn-success">+ Добавить бренд</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for brand in brands %}
            <tr>
                <td>{{ brand.id }}</td>
                <td><a href="{% url 'brand_detail' brand.id %}">{{ brand.name }}</a></td>
                <td>
                    <a href="{% url 'brand_update' brand.id %}" class="btn btn-sm btn-warning">Редактировать</a>
                    <a href="{% url 'brand_delete' brand.id %}" class="btn btn-sm btn-danger">Удалить</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">Брендов пока нет.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
{% endblock  %}
