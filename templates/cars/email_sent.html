{% extends 'cars/base.html' %}
{% block main_content %}
<div style="max-width: 600px; margin: 50px auto; padding: 40px; background-color: #0b111e; border-radius: 12px; color: #ffffff; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
    <h2 style="color: #3b82f6; margin-bottom: 20px;">📩 Confirmation Link Sent!</h2>
    <p style="font-size: 16px; color: #a0aec0; line-height: 1.6;">
        We have sent a verification link to your email: <b style="color: #ffffff;">{{ email }}</b>.
    </p>
    <p style="font-size: 14px; color: #e2e8f0; margin-top: 20px; background: #1e293b; padding: 12px; border-radius: 6px;">
        Please check your inbox and click <b>Confirm</b> or <b>Cancel</b> to process your transaction.
    </p>
    <a href="{% url 'profile' %}" style="display: inline-block; margin-top: 25px; padding: 12px 24px; background-color: #475569; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">Go to Profile</a>
</div>
{% endblock %}
