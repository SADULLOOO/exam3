{% extends 'cars/base.html' %}
{% block main_content %}

<div class="brand-page">
  {% if brand.logo %}
    <img src="{{ brand.logo.url }}" alt="{{ brand.name }}">
  {% endif %}

  <h1>{{ brand.name }}</h1>
  
  <div>
    {% for model in models %}
      <a href="{% url 'model_detail' model.id %}">
        <h2>{{ model.name }}</h2>
      </a>
    {% endfor %}
  </div>
</div>

{% if request.user.is_superuser %}
<div style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; font-size: 14px; background: rgba(0, 0, 0, 0.7); padding: 8px 15px; border-radius: 6px;">
    <a href="{% url 'brand_create' %}" style="color: #4caf50; margin-right: 15px; text-decoration: none; font-weight: bold;">Create</a>
    <a href="{% url 'brand_update' brand.id %}" style="color: #ff9800; margin-right: 15px; text-decoration: none; font-weight: bold;">Edit</a>
    <a href="{% url 'brand_delete' brand.id %}" style="color: #f44336; text-decoration: none; font-weight: bold;">Delete</a>
</div>
{% endif %}

{% endblock %}
