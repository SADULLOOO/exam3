{% extends 'cars/base.html' %}
{% block main_content %}
<div style="max-width: 600px; margin: 80px auto; padding: 40px; background-color: #0b111e; border: 2px solid #ef4444; border-radius: 12px; color: #ffffff; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: sans-serif;">
    <div style="font-size: 50px; margin-bottom: 15px;">🚫</div>
    <h2 style="color: #ef4444; margin-bottom: 20px; font-size: 24px;">Доставка недоступна</h2>
    <p style="font-size: 16px; color: #a0aec0; line-height: 1.6;">
        {{ error_message }}
    </p>
    <p style="font-size: 14px; color: #64748b; margin-top: 15px;">
        Геолокация курьера и чат активируются только после полной оплаты товара или одобрения кредита банком.
    </p>
    <a href="{% url 'profile' %}" style="display: inline-block; margin-top: 25px; padding: 12px 24px; background-color: #ef4444; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; transition: background 0.2s;">Вернуться в профиль</a>
</div>
{% endblock %}
