{% extends 'cars/base.html' %}

{% block main_content %}
<div class="ai-wrapper">
  <h1>OrderCar AI Assistant</h1>
  <form>
    <input name="prompt" placeholder="Ask AI..." value="{{ prompt }}">
    <button>Send</button>
  </form>
  {% if answer %}
    <div class="ai-answer">{{ answer }}</div>
  {% endif %}
</div>
{% endblock %}
