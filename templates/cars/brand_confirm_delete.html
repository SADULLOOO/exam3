{% extends "cars/base.html" %}
{% block main_content %}

<div style="
  max-width: 500px;
  margin: 80px auto;
  padding: 0 24px;
">

  <div style="
    background: #0f1829;
    border: 1px solid rgba(239,68,68,0.35);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  ">

    <div style="
      background: rgba(239,68,68,0.12);
      border-bottom: 1px solid rgba(239,68,68,0.25);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    ">
      <span style="font-size:20px;">⚠️</span>
      <h2 style="
        font-family: 'Syne', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #ef4444;
        margin: 0;
      ">Delete Brand</h2>
    </div>

    <div style="padding: 28px 24px;">

      <p style="
        color: #7a93b8;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
      ">
        Are you sure you want to delete brand
        <strong style="color: #f0f4ff;">{{ object.name }}</strong>?
        This action cannot be undone.
      </p>

      <form method="POST" style="display:flex; gap:10px;">
        {% csrf_token %}
        <button type="submit" style="
          background: linear-gradient(135deg, #ef4444, #dc2626);
          color: #fff;
          border: none;
          padding: 11px 24px;
          border-radius: 9px;
          font-size: 14px;
          font-weight: 700;
          font-family: 'DM Sans', sans-serif;
          cursor: pointer;
          transition: all 0.22s;
          box-shadow: 0 4px 14px rgba(239,68,68,0.3);
        ">
          Yes, Delete
        </button>

        <a href="{% url 'brand_list' %}" style="
          background: #131f35;
          color: #7a93b8;
          border: 1px solid #1e3050;
          padding: 11px 24px;
          border-radius: 9px;
          font-size: 14px;
          font-weight: 600;
          font-family: 'DM Sans', sans-serif;
          text-decoration: none;
          transition: all 0.22s;
          display: inline-block;
        ">
          Cancel
        </a>
      </form>

    </div>
  </div>
</div>

{% endblock %}
