{% extends 'cars/base.html' %}
{% block main_content %}
<div style="max-width: 600px; margin: 50px auto; padding: 40px; background-color: #0b111e; border-radius: 12px; color: #ffffff; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-top: 5px solid #ef4444;">
    <h2 style="color: #ef4444; margin-bottom: 20px;">❌ Purchase Cancelled</h2>
    <p style="font-size: 16px; color: #a0aec0;">
        You have declined the transaction for <b>{{ item.car.title }}</b>. The order status has been updated to cancelled.
    </p>
    <a href="/" style="display: inline-block; margin-top: 25px; padding: 12px 24px; background-color: #475569; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">Return to Catalog</a>
</div>
{% endblock %}
