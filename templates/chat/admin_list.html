{% extends 'cars/base.html' %}
{% load static %}

{% block main_content %}

<div style="max-width: 760px; margin: 40px auto; padding: 0 24px;">

  <h2 style="
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #f0f4ff;
    margin-bottom: 24px;
  ">💬 All Chats</h2>

  <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
    {% for chat in conversations %}
      <li style="
        background: #0f1829;
        border: 1px solid #1e3050;
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.22s;
        font-size: 14px;
        color: #7a93b8;
      ">
        <span>User <b style="color:#f0f4ff;">{{ chat.buyer.username }}</b> — {{ chat.car.title }}</span>
        <a href="{% url 'chat_owner_admin' chat.id %}" style="
          padding: 7px 16px;
          background: rgba(232,93,4,0.1);
          border: 1px solid rgba(232,93,4,0.4);
          color: #e85d04;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 600;
          text-decoration: none;
          white-space: nowrap;
        ">Open Chat →</a>
      </li>
    {% empty %}
      <li style="color: #3d5478; font-style: italic; padding: 20px 0;">
        No active chats yet
      </li>
    {% endfor %}
  </ul>

</div>

{% endblock %}
