<h2>Создай свой собственный CarOrder 🚀</h2>
<p>Стоимость обслуживания: минимум $15,000 - $20,000 в месяц. Спустя 6 месяцев цена увеличивается.</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background: linear-gradient(to right, #ff416c, #ff4b2b); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        Получить Лицензию и Создать Движок!
    </button>
</form>
